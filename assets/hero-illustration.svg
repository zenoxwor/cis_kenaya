<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="1" stop-color="#fff4ea"/>
    </linearGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Organic blob background -->
  <g transform="translate(600,380)">
    <path d="M150,-220C210,-180,260,-110,260,-40C260,30,210,100,150,140C90,180,30,200,-40,205C-110,210,-220,195,-260,145C-300,95,-275,10,-260,-50C-245,-110,-240,-160,-187,-195C-134,-230,-76,-235,-20,-230C36,-225,86,-210,150,-220Z" fill="url(#g1)" filter="url(#s)"/>
  </g>

  <!-- School building simplified -->
  <g transform="translate(360,330)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#ffffff" stroke="#F2D9A8" stroke-width="2"/>
    <polygon points="0,0 240,-90 480,0" fill="#F7D88A"/>
    <rect x="60" y="60" width="60" height="60" rx="8" fill="#FFEAC0"/>
    <rect x="180" y="60" width="60" height="60" rx="8" fill="#FFEAC0"/>
    <rect x="300" y="60" width="60" height="60" rx="8" fill="#FFEAC0"/>
    <rect x="420" y="60" width="40" height="60" rx="8" fill="#FFEAC0"/>
  </g>

  <!-- Decorative students (circles) -->
  <g transform="translate(720,200)">
    <circle cx="0" cy="0" r="18" fill="#FF6B6B" opacity="0.95">
      <animate attributeName="cy" values="0;-12;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="20" r="14" fill="#6BCBFF" opacity="0.95">
      <animate attributeName="cy" values="20;8;20" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-50" cy="30" r="16" fill="#8D6BFF" opacity="0.95">
      <animate attributeName="cy" values="30;18;30" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground: small campus scene -->
  <g transform="translate(360,520)">
    <rect x="0" y="0" width="480" height="60" rx="12" fill="#F3F3F3"/>
    <circle cx="60" cy="30" r="6" fill="#C5A028"/>
    <circle cx="120" cy="30" r="6" fill="#8D6BFF"/>
    <circle cx="180" cy="30" r="6" fill="#6BCBFF"/>
  </g>

  <!-- subtle caption -->
  <g transform="translate(40,720)">
    <text x="0" y="0" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#777">Kenya Campus — welcoming learners</text>
  </g>
</svg>